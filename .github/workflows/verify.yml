name: Verify

on:
    workflow_dispatch:
    push:
        branches:
            - "**"

jobs:
    android:
        name: Verify Android (debug)
        runs-on: ubuntu-latest

        steps:
            - name: 代码迁出
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@v4
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: 拉取依赖
              run: flutter pub get

            - name: 静态分析
              continue-on-error: true
              run: flutter analyze

            - name: 构建 Debug Apk
              run: flutter build apk --debug --no-pub

            - name: 上传产物
              uses: actions/upload-artifact@v4
              with:
                  name: PiliPlus-debug-apk
                  path: build/app/outputs/flutter-apk/*.apk
